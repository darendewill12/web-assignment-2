    <div class="forma-container">
        <h2>Job application form</h2>
        <form id="jobform">
            <div class="inputs-group">
                <label>Full name </label>
                <input type="text" placeholder="Enter Your Name" required>
            </div>
            <div class="inputs-group">
                <label>Email Address</label>
                <input type="email" placeholder="Enter Email" required>
            </div>
            <div class="inputs-group">
                <label>Phone Number</label>
                <input type="tel" placeholder="Enter Your Phone number" required>
            </div>
            <div class="inputs-group">
                <label>LinkedIn Link</label>
                <input type="url" placeholder="https://Linkedin.com/in/username">
            </div>
            <div class="drop-down">
                <label>Highest Qualification</label>
                <select>
                    <option value="">Choose your degree</option>
                    <option value="">BTEC Level 3</option>
                    <option value="">Degree</option>
                    <option value="">Bootcamp Certification</option>
                </select>
            </div>
            <div class="inputs-group">
                <label>Relevant Courses Completed</label>
                <textarea placeholder="Write if you have more degrees" rows="4"></textarea>
            </div>
            <div class="inputs-groups">

                <div class="inputs-groups">
                    <label class="full">Technical Skills Checklist</label>

                    <label><input type="checkbox" id="html" value="html"> HTML</label>
                    <label><input type="checkbox" id="css" value="css"> CSS</label>
                    <label><input type="checkbox" id="javascript" value="javascript"> JavaScript</label>

                    <div>
                        <label><input type="checkbox" id="other" value="other"> Other</label>
                        <input type="text" id="otherValue" placeholder="Specify other skill">
                    </div>
                </div>


            </div>

            <div class="inputs-group">
                <label>Upload CV</label>
                <div class="file-input">
                    <input type="file" id="cvupload" required>
                    <label for="cvupload" class="custom-file-label">Choose File</label>
                </div>
            </div>
            <div class="inputs-group">
                <label>Cover Letter</label>
                <div class="file-input">
                    <input type="file" id="cov-letter">
                    <label for="cov-letter" class="custom-file-label">Choose File</label>
                </div>
            </div>

            <button type="submit" class="submit-btn">Submit Application</button>
            <button type="reset" class="clear-btn">Clear</button>

        </form>
    </div>
